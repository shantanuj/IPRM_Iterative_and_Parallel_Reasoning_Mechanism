# comet logger params
WANDB:
  EXPERIMENT_NAME: "iprm_m6_t9"
  PROJECT_NAME: "STAR_VideoQA_IPRM"
  
SAVE_DIRECTORY: '/data/user_data/sjaiswa3/iprm_ckpts/STAR_VideoQA_models/iprm_m6_t9'

DATALOADER:
  BATCH_SIZE: 64
  EVAL_BATCH_SIZE: 128
  NUM_SAMPLE_FRAMES: 16
  #FRAME_SAMPLE_EVERY_NUM: 4 #6
  
SOLVER:
  EPOCHS: 50
  LANG_ENC_LR: 1e-4
  FACTOR: 0.75
    
  CRITERION: 'binary_cross_entropy' #cross_entropy
  LR: 0.0001
  PATIENCE: 1


VLM:
    PROCESS_EACH_OPTION_INDEPENDENTLY: True
    MODULE_TYPE: "iprm"
    USE_PRETRAINED_LANG_ENCODER: False
    PRETRAINED_LANG_EMBEDDING_PATH: "/data/user_data/sjaiswa3/iprm_ckpts/ckpts/ckp2/vqav2_embeddings.pth"
    PRETRAINED_LANG_TOKENIZER_PATH: '/data/user_data/sjaiswa3/iprm_ckpts/ckpts/ckp2/vqav2_tokenizer.pth'
    
    REMOVE_FIRST_AND_LAST_SPECIAL_TOKENS_PRETRAINED_LANG_ENCODER: False
    ADD_AUX_LANG_TOKEN: True
    
    LANG_SUMMARY_REP_DROPOUT: 0.08
    VIS_STEM_DROPOUT: 0.15
    CLASSIFIER_TYPE: 'concat_lang_and_result'
    
    SHARE_QUESTION_AND_OPTION_ENCODER: True
    SHARE_QUESTION_AND_OPTION_PROJS_METHOD: 'share_options'  

    ADD_LANG_AND_CHOICE_POSITIONAL_EMBEDS: False
    COMBINE_QUES_AND_OPTION_SUMMARY_FOR_MODULE: True
    CONCAT_QUESTION_AND_OPTION_LANG_REPS_FOR_MODULE: True
    
    USE_FRAME_POS_EMBEDS: True
        
    PERSON_BBOX_LATENT_DIMS: 256 #128
    PERSON_BBOX_LATENT_DROP: 0.15
    USE_PERSON_EMBEDDING: True
    PERSON_COORDS_LATENT_METHOD: 'indv_projs_then_sum' #indv_projs_then_sum, concat_coords_then_proj
    PERSON_COORDS_LATENT_DIMS: 256
    PERSON_COORDS_LATENT_DROP: 0.2
    
    OBJ_BBOX_LATENT_DIMS: 128
    OBJ_BBOX_LATENT_DROP: 0.15
    OBJ_LABEL_LATENT_DIMS: 128
    OBJ_LABEL_LATENT_DROP: 0.15
    
    USE_COMBINED_OBJ_REL_EMBED: False
    OBJ_REL_EMBD_DIMS: 256
    OBJ_REL_LATENT_DIMS: 128
    OBJ_REL_LATENT_DROP: 0.15
    UNIFORM_INIT_OBJ_RELS_EMBED: True
    
    INDV_OPTION_CLASSIFIER_DROP: 0.08
    CLASSIFIER_DROPOUT: 0.15
    INDEPENDENT_OPTION_CLASSIFIER_TYPE: 'joint_concat'
    INDIVIDUAL_OPTION_CLASSIFIER_DIM: 256
    
    LSTM_APPLY_AUX_PROJS: True
    
IPRM:
    NUM_MEMORY_TOKENS: 6
    NUM_COMPUTATION_STEPS: 9
    
    LANG_BLOCK_NONLIN: 'tanh'
    LANG_BLOCK_MLP_DROP: 0.1
    
    VIS_BLOCK_DROP: 0.15
    VIS_BLOCK_NONLIN: 'elu'
    REDUCTION_R: 2
    
    
    MEMORY_RES_POOL_METHOD: 'lang_cuml_query_op'
    MEMORY_ATT_WINDOW_LEN: 2
    
    