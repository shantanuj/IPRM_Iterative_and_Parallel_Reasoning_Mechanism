# comet logger params
#use train_with_diff_lrs.py for this!
COMET:
  EXPERIMENT_NAME: "RMAM M6 T9; redr2; Window 2; With DISTIL Roberta encoder 1e-5; patience 0 (for CLEVR); 272 feats"
  PROJECT_NAME: "RMAM_Experiments_Final_ICLR24"
  
SAVE_DIRECTORY: '/data/user_data/sjaiswa3/iprm_runs'

SOLVER:
  EPOCHS: 35
  LANG_ENC_LR: 1e-5
    
  CLEVR_HUMAN_EPOCHS: 50
  LR: 0.0001
  PATIENCE: 0
  CLEVR_H_PATIENCE: 1


VLM:
    MODULE_TYPE: "iprm"
    USE_PRETRAINED_LANG_ENCODER: True
    #PRETRAINED_LANG_ENCODER_PATH: '/data/user_data/sjaiswa3/iprm_ckpts/ckpts/ckp2/distil_roberta_base_encoder.pth'
    #PRETRAINED_LANG_TOKENIZER_PATH: '/data/user_data/sjaiswa3/iprm_ckpts/ckpts/ckp2/distil_roberta_base_tokenizer.pth'
    REMOVE_FIRST_AND_LAST_SPECIAL_TOKENS_PRETRAINED_LANG_ENCODER: True 
    LANG_SUMMARY_REP_DROPOUT: 0.08
    VIS_STEM_DROPOUT: 0.15
    ADD_VIS_POSITIONAL_EMBDS: False
    CLASSIFIER_TYPE: 'concat_lang_and_result'
    
IPRM:
    NUM_MEMORY_TOKENS: 6
    NUM_COMPUTATION_STEPS: 9
    
    LANG_BLOCK_NONLIN: 'tanh'
    LANG_BLOCK_MLP_DROP: 0.1
    
    VIS_BLOCK_DROP: 0.15
    VIS_BLOCK_NONLIN: 'elu'
    REDUCTION_R: 2
    
    
    MEMORY_RES_POOL_METHOD: 'lang_cuml_query_op'
    MEMORY_ATT_WINDOW_LEN: 2
    
    
    

  

DATALOADER:
  BATCH_SIZE: 12 #192
  EVAL_BATCH_SIZE: 24 #384
  FEATURES_PATH: "/data/user_data/sjaiswa3/iprm_datasets/clevr/clevr_feats/features_272x272"
